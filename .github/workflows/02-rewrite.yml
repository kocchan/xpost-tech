name: 02 Rewrite (GitHub Actions fallback)

# Claude routine を 8:30 に走らせる前提だが、routine が動かない/止まっているときの
# 保険として、この workflow を 8:45 (UTC 23:45) に走らせる。
# routine が成功して posts.md が既に存在する日はスキップする。
#
# routine を使わずに GitHub Actions に一本化したい場合は、Claude routine を登録せず
# この workflow だけ有効にすればよい。
#
# 必要な Secrets:
#   ANTHROPIC_API_KEY : Claude API キー

on:
  schedule:
    - cron: "45 23 * * *"  # UTC 23:45 = JST 翌日 8:45
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 YYYY-MM-DD (空欄なら yesterday=JST 昨日)"
        required: false
        default: ""
      force:
        description: "既に posts.md があっても上書きする"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Resolve target date (yesterday in JST if empty)
        id: date
        run: |
          INPUT="${{ github.event.inputs.target_date }}"
          if [ -z "$INPUT" ]; then
            TD=$(TZ=Asia/Tokyo date -d "yesterday" +%Y-%m-%d)
          else
            TD="$INPUT"
          fi
          echo "target_date=$TD" >> "$GITHUB_OUTPUT"

      - name: Skip if posts.md already exists
        id: check
        run: |
          MD="output/rewrites/${{ steps.date.outputs.target_date }}/posts.md"
          FORCE="${{ github.event.inputs.force }}"
          if [ -f "$MD" ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[skip] $MD already exists (Claude routine が先に書いた可能性)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run rewrite
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 .claude/skills/x-slack-poster/scripts/rewrite_top.py \
              --raw-root output/raw \
              --rewrite-root output/rewrites \
              --target-date "${{ steps.date.outputs.target_date }}" \
              --top 10

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add output/rewrites/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "rewrite: posts.md for ${{ steps.date.outputs.target_date }} (JST)"
          git push
