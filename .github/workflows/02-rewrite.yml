name: 02 Rewrite (Claude Sonnet 4.6)

# 毎朝 JST 8:30 (UTC 23:30 前日) に raw_posts.json から Top 10 を選び、
# Claude Sonnet 4.6 でリライトして output/rewrites/<yesterday>/posts.md として commit する。
#
# 必要な Secrets:
#   ANTHROPIC_API_KEY : Claude API キー
#
# 手動実行も可 (workflow_dispatch、target_date を任意指定)。

on:
  schedule:
    - cron: "30 23 * * *"  # UTC 23:30 = JST 翌日 8:30
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 YYYY-MM-DD (空欄なら yesterday=JST 昨日)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Resolve target date (yesterday in JST if empty)
        id: date
        run: |
          INPUT="${{ github.event.inputs.target_date }}"
          if [ -z "$INPUT" ]; then
            TD=$(TZ=Asia/Tokyo date -d "yesterday" +%Y-%m-%d)
          else
            TD="$INPUT"
          fi
          echo "target_date=$TD" >> "$GITHUB_OUTPUT"

      - name: Pull latest (collect の commit を取りに行く)
        run: git pull --rebase || true

      - name: Run rewrite
        run: |
          python3 scripts/rewrite_top.py \
              --raw-root output/raw \
              --rewrite-root output/rewrites \
              --target-date "${{ steps.date.outputs.target_date }}" \
              --top 10

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/rewrites/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "rewrite: posts.md for ${{ steps.date.outputs.target_date }} (JST)"
          git push
